openapi: 3.1.0
info:
  title: Smartbar Backoffice API
  description: Smartbar Backoffice API
  version: 1.0.0
paths:
  /menu:
    get:
      operationId: getMenu
      summary: Get all articles grouped by category
      responses:
        200:
          description: Menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/menuApi'
components:
  schemas:
    menuApi:
      type: array
      items:
        $ref: '#/components/schemas/menuItemApi'
    menuItemApi:
      type: object
      additionalProperties: false
      required: [ category, articles ]
      properties:
        category:
          type: string
        articles:
          type: array
          items:
            $ref: '#/components/schemas/articleApi'
    articleApi:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Server-generated identifier
        categoryId:
          type: integer
          format: int64
          description: id of the corresponding category
        name:
          type: string
        price:
          type: number
          format: float
        description:
          type: string
        picture:
          type: string
          format: uri
      required:
        - name
        - price
quarkus:
  rest-client:
    org.lunskra.menu.MenuApiClient:
      url: "http://localhost:8088"
  cache:
    caffeine:
      expire-after-write: PT10M
  mongodb:
    connection-string: mongodb://localhost:27017
    uuid-representation: java-legacy
rabbitmq-host: localhost
rabbitmq-port: 5672
rabbitmq-username: smartbar
rabbitmq-password: smartbar
mp:
  messaging:
    incoming:
      menu-update-events:
        connector: smallrye-rabbitmq
        queue:
          name: menuupdates

